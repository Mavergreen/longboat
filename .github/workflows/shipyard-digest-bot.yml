name: shipyard-digest-bot

# spec: INGREDIENTS.md "The shipyard scripts digest" -- the digest job reads shipyard's bytes with
#       contents: read only; the push job touches none of them, and commits and pushes the checked
#       digest with the pins-bot App's token
# platform: a push made with GITHUB_TOKEN starts PR runs that wait for a person's approval, and a
#           build it dispatches does not count for the PR's required check; an App's push starts
#           them as Renovate's own pushes do

on:
  push:
    branches: ['renovate/**']

permissions: {}

# platform: a newer push to the branch cancels a run still working on an older one, and the App's own
#           push starts a run too; that run gets a group of its own and skips its jobs, because its push
#           is the checked digest, and in the shared group it would cancel the run that pushed it
concurrency:
  group: shipyard-digest-bot-${{ github.ref }}${{ github.actor == 'mavergreen-pins-bot[bot]' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  digest:
    if: github.actor != 'mavergreen-pins-bot[bot]'
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.fill.outputs.stale }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The digest of the shipyard scripts longboat ships, if the pinned shipyard moved it
        id: fill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          digest="$(sh build/digest-bot.sh fill)"
          if [ -n "$digest" ]; then
            printf '%s\n' "$digest" > "$RUNNER_TEMP/scripts.sha256"
            echo "stale=yes" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.fill.outputs.stale == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: shipyard-scripts-digest
          path: ${{ runner.temp }}/scripts.sha256

  push:
    needs: digest
    if: needs.digest.outputs.stale == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.PINS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PINS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/download-artifact@v8
        with:
          name: shipyard-scripts-digest
          path: ${{ runner.temp }}/digest

      - name: Commit the digest to the branch as the App's bot
        env:
          BRANCH: ${{ github.ref_name }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          applied="$(sh build/digest-bot.sh apply "$RUNNER_TEMP/digest/scripts.sha256")"
          [ "$applied" = changed ] || { echo "components/shipyard/scripts.sha256 already holds it"; exit 0; }
          id="$(gh api "/users/$SLUG%5Bbot%5D" --jq .id)"
          git -c user.name="$SLUG[bot]" -c user.email="$id+$SLUG[bot]@users.noreply.github.com" \
            commit -q -m 'chore(shipyard): the digest of the shipyard scripts longboat ships' \
            components/shipyard/scripts.sha256
          git push origin "HEAD:refs/heads/$BRANCH"
